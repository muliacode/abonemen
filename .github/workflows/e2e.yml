name: e2e

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite, intl, mbstring, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare the environment file
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build assets
        run: npm run build

      - name: Type check the end-to-end tests
        if: ${{ matrix.browser == 'chromium' }}
        run: npm run types:check:e2e

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload the report and server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            build/playwright
            storage/logs/laravel.log
          if-no-files-found: ignore
          retention-days: 14

  # The check to mark as required: it fails when any browser fails or is cancelled.
  e2e-passed:
    name: E2E passed
    if: ${{ always() }}
    needs: [playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the result of every browser
        env:
          RESULT: ${{ needs.playwright.result }}
        run: |
          echo "Playwright result: $RESULT"
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Playwright failed in at least one browser."
            exit 1
          fi
