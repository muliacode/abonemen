; SPIKE (#14): production PHP settings for the container.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 2M
post_max_size = 4M
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
realpath_cache_size = 4096K
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
session.save_path = /tmp
